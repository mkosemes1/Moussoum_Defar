<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Registration - Moussoum Defar</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="/templates/index.html" class="nav-back">← Back to Home</a>
        </div>

        <div class="header">
            <h1>Client Registration</h1>
            <p>Register your company to test AI models</p>
        </div>

        <div class="card" style="max-width: 600px; margin: 0 auto;">
            <div id="error" class="alert alert-error"></div>
            <div id="success" class="alert alert-success"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Username *</label>
                    <input type="text" id="username" placeholder="Choose a username" required>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" placeholder="Create a password" required>
                </div>

                <div class="form-group">
                    <label for="companyName">Company Name *</label>
                    <input type="text" id="companyName" placeholder="Your company name" required>
                </div>

                <div class="form-group">
                    <label for="companyDescription">Company Description</label>
                    <textarea id="companyDescription" rows="3" placeholder="What does your company do? What AI models are you building?"></textarea>
                </div>

                <div class="form-group">
                    <label for="website">Website</label>
                    <input type="url" id="website" placeholder="https://yourcompany.com">
                </div>

                <button type="submit" class="btn" id="submitBtn" style="width: 100%;">Create Account</button>
            </form>

            <div class="link">
                <p>Already have an account? <a href="/templates/client-login.html">Login here</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');

            const data = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                company_name: document.getElementById('companyName').value,
                company_description: document.getElementById('companyDescription').value,
                website: document.getElementById('website').value
            };

            document.getElementById('submitBtn').disabled = true;

            try {
                const response = await fetch('/api/v1/auth/register/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || JSON.stringify(result));
                }

                localStorage.setItem('clientToken', result.tokens.access);
                localStorage.setItem('clientData', JSON.stringify(result.client));

                successDiv.textContent = 'Registration successful! Redirecting to evaluation...';
                successDiv.classList.add('show');

                setTimeout(() => {
                    window.location.href = '/templates/evaluation.html';
                }, 1500);

            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.add('show');
            } finally {
                document.getElementById('submitBtn').disabled = false;
            }
        });
    </script>
</body>
</html>
