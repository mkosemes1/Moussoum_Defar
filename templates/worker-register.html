<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Registration - Moussoum Defar</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="/templates/index.html" class="nav-back">← Back to Home</a>
        </div>

        <div class="header">
            <h1>Worker Registration</h1>
            <p>Join Moussoum Defar and earn money collecting data</p>
        </div>

        <div class="card">
            <div id="error" class="alert alert-error"></div>
            <div id="success" class="alert alert-success"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="username">Username *</label>
                    <input type="text" id="username" placeholder="Choose a username" required>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" placeholder="Create a password" required>
                    <p class="form-hint">Must be at least 8 characters</p>
                </div>

                <div class="form-group">
                    <label for="password2">Confirm Password *</label>
                    <input type="password" id="password2" placeholder="Confirm your password" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="+221771234567">
                </div>

                <div class="form-group">
                    <label for="country">Country</label>
                    <select id="country">
                        <option value="">Select your country</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="languages">Languages (hold Ctrl to select multiple)</label>
                    <select id="languages" multiple>
                    </select>
                </div>

                <div class="form-group">
                    <label for="bio">Bio</label>
                    <textarea id="bio" rows="3" placeholder="Tell us about yourself and your skills..."></textarea>
                </div>

                <button type="submit" class="btn" id="submitBtn" style="width: 100%;">Create Account</button>
            </form>

            <div class="link">
                <p>Already have an account? <a href="/templates/worker-login.html">Login here</a></p>
            </div>
        </div>
    </div>

    <script>
        // Load countries and languages
        async function loadOptions() {
            const fallbackCountries = [
                { code: 'SN', name: 'Senegal', languages: [{ code: 'wo', name: 'Wolof' }, { code: 'fr', name: 'French' }] },
                { code: 'NG', name: 'Nigeria', languages: [{ code: 'pcm', name: 'Nigerian Pidgin' }, { code: 'en', name: 'English' }, { code: 'ha', name: 'Hausa' }] },
                { code: 'KE', name: 'Kenya', languages: [{ code: 'sw', name: 'Swahili' }, { code: 'en', name: 'English' }, { code: 'sh', name: 'Sheng' }] },
                { code: 'GH', name: 'Ghana', languages: [{ code: 'ak', name: 'Akan' }, { code: 'en', name: 'English' }] },
                { code: 'CI', name: 'Ivory Coast', languages: [{ code: 'fr', name: 'French' }, { code: 'diou', name: 'Dioula' }] },
                { code: 'ML', name: 'Mali', languages: [{ code: 'bm', name: 'Bambara' }, { code: 'fr', name: 'French' }] },
                { code: 'CM', name: 'Cameroon', languages: [{ code: 'fr', name: 'French' }, { code: 'en', name: 'English' }] },
                { code: 'TZ', name: 'Tanzania', languages: [{ code: 'sw', name: 'Swahili' }, { code: 'en', name: 'English' }] },
                { code: 'ET', name: 'Ethiopia', languages: [{ code: 'am', name: 'Amharic' }, { code: 'en', name: 'English' }] },
                { code: 'ZA', name: 'South Africa', languages: [{ code: 'af', name: 'Afrikaans' }, { code: 'zu', name: 'Zulu' }, { code: 'en', name: 'English' }] }
            ];

            const countrySelect = document.getElementById('country');
            const langSelect = document.getElementById('languages');
            const allLanguages = new Map();

            fallbackCountries.forEach(country => {
                const option = document.createElement('option');
                option.value = country.code;
                option.textContent = country.name;
                countrySelect.appendChild(option);

                country.languages.forEach(lang => {
                    allLanguages.set(lang.code, lang);
                });
            });

            allLanguages.forEach(lang => {
                const option = document.createElement('option');
                option.value = lang.code;
                option.textContent = lang.name;
                langSelect.appendChild(option);
            });
        }

        loadOptions();

        // Form submission
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');

            const password = document.getElementById('password').value;
            const password2 = document.getElementById('password2').value;

            if (password !== password2) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.classList.add('show');
                return;
            }

            const languages = Array.from(document.getElementById('languages').selectedOptions).map(opt => opt.value);

            const data = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: password,
                password2: password2,
                phone: document.getElementById('phone').value,
                country: document.getElementById('country').value || null,
                languages: languages,
                bio: document.getElementById('bio').value
            };

            document.getElementById('submitBtn').disabled = true;

            try {
                const response = await fetch('/api/v1/workers/auth/register/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || JSON.stringify(result));
                }

                localStorage.setItem('workerToken', result.tokens.access);
                localStorage.setItem('workerData', JSON.stringify(result.worker));

                successDiv.textContent = 'Registration successful! Redirecting to dashboard...';
                successDiv.classList.add('show');

                setTimeout(() => {
                    window.location.href = '/templates/worker-dashboard.html';
                }, 1500);

            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.add('show');
            } finally {
                document.getElementById('submitBtn').disabled = false;
            }
        });
    </script>
</body>
</html>
