<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Login - Moussoum Defar</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="/templates/index.html" class="nav-back">← Back to Home</a>
        </div>

        <div class="header">
            <h1>Worker Login</h1>
            <p>Access your Moussoum Defar account</p>
        </div>

        <div class="card" style="max-width: 500px; margin: 0 auto;">
            <div id="error" class="alert alert-error"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn" id="submitBtn" style="width: 100%;">Login</button>
            </form>

            <div class="link">
                <p>Don't have an account? <a href="/templates/worker-register.html">Register here</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const errorDiv = document.getElementById('error');
            errorDiv.classList.remove('show');

            const data = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            document.getElementById('submitBtn').disabled = true;

            try {
                const response = await fetch('/api/v1/workers/auth/login/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Invalid credentials');
                }

                localStorage.setItem('workerToken', result.tokens.access);
                localStorage.setItem('workerData', JSON.stringify(result.worker));

                window.location.href = '/templates/worker-dashboard.html';

            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.add('show');
            } finally {
                document.getElementById('submitBtn').disabled = false;
            }
        });
    </script>
</body>
</html>
