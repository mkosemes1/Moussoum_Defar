<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Registration - Moussoum Defar</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body { background: #0f172a; }
        
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }

        .auth-left {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            position: relative;
            overflow: hidden;
        }

        .auth-left::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 30% 50%, rgba(16, 185, 129, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
        }

        .auth-left-content {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 400px;
        }

        .auth-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin: 0 auto 24px;
            box-shadow: 0 20px 40px rgba(16, 185, 129, 0.3);
        }

        .auth-left h2 {
            font-size: 28px;
            color: white;
            margin-bottom: 16px;
        }

        .auth-left p {
            font-size: 16px;
            color: rgba(255,255,255,0.6);
            line-height: 1.7;
        }

        .auth-benefits {
            margin-top: 32px;
            text-align: left;
        }

        .benefit-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            color: rgba(255,255,255,0.8);
        }

        .benefit-icon {
            width: 32px;
            height: 32px;
            background: rgba(16, 185, 129, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .auth-right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            padding: 40px;
            backdrop-filter: blur(20px);
        }

        .auth-card h1 {
            font-size: 28px;
            color: white;
            margin-bottom: 8px;
        }

        .auth-card .subtitle {
            font-size: 15px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 32px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: rgba(255,255,255,0.8);
            font-size: 14px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            font-size: 15px;
            color: white;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #10b981;
            outline: none;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .form-group select option {
            background: #1e293b;
            color: white;
        }

        /* Language Selection */
        .language-selection {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 16px;
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            min-height: 60px;
        }

        .lang-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: rgba(16, 185, 129, 0.1);
            border: 2px solid rgba(16, 185, 129, 0.3);
            border-radius: 20px;
            color: #10b981;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .lang-chip:hover {
            background: rgba(16, 185, 129, 0.2);
        }

        .lang-chip.selected {
            background: #10b981;
            color: white;
            border-color: #10b981;
        }

        .lang-chip .remove {
            display: none;
            font-size: 16px;
            margin-left: 4px;
        }

        .lang-chip.selected .remove {
            display: inline;
        }

        .lang-add-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.05);
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .lang-add-btn:hover {
            border-color: #10b981;
            color: #10b981;
        }

        .lang-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            margin-top: 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }

        .lang-dropdown.show {
            display: block;
        }

        .lang-option {
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.2s;
            color: white;
            font-size: 14px;
        }

        .lang-option:hover {
            background: rgba(16, 185, 129, 0.2);
        }

        .lang-option.selected {
            background: rgba(16, 185, 129, 0.3);
            color: #10b981;
        }

        .selected-languages {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .selected-lang {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: #10b981;
            border-radius: 16px;
            font-size: 13px;
            color: white;
            font-weight: 500;
        }

        .selected-lang button {
            background: none;
            border: none;
            color: white;
            font-size: 14px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .auth-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: rgba(255,255,255,0.5);
        }

        .auth-footer a {
            color: #10b981;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 14px 16px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 14px;
            display: none;
        }

        .alert.show { display: block; }
        .alert-error { background: rgba(220, 38, 38, 0.1); color: #fca5a5; border: 1px solid rgba(220, 38, 38, 0.3); }
        .alert-success { background: rgba(16, 185, 129, 0.1); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.3); }

        @media (max-width: 900px) {
            .auth-wrapper { flex-direction: column; }
            .auth-left { padding: 40px 20px; }
            .auth-right { padding: 20px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-left">
            <div class="auth-left-content">
                <div class="auth-icon">👤</div>
                <h2>Become a Data Worker</h2>
                <p>Join thousands of Africans earning money by collecting data for AI.</p>
                <div class="auth-benefits">
                    <div class="benefit-item">
                        <div class="benefit-icon">💰</div>
                        <span>Earn money in your language</span>
                    </div>
                    <div class="benefit-item">
                        <div class="benefit-icon">📊</div>
                        <span>Level up with quality scores</span>
                    </div>
                    <div class="benefit-item">
                        <div class="benefit-icon">🌍</div>
                        <span>Work from anywhere in Africa</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="auth-right">
            <div class="auth-card">
                <h1>Create Account</h1>
                <p class="subtitle">Fill in your details to get started</p>

                <div id="error" class="alert alert-error"></div>
                <div id="success" class="alert alert-success"></div>

                <form id="registerForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Username *</label>
                            <input type="text" id="username" placeholder="Choose a username" required>
                        </div>
                        <div class="form-group">
                            <label>Email *</label>
                            <input type="email" id="email" placeholder="your@email.com" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Password *</label>
                            <input type="password" id="password" placeholder="Create password" required>
                        </div>
                        <div class="form-group">
                            <label>Confirm Password *</label>
                            <input type="password" id="password2" placeholder="Confirm password" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" id="phone" placeholder="+221771234567">
                        </div>
                        <div class="form-group">
                            <label>Country</label>
                            <select id="country">
                                <option value="">Select country</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Languages</label>
                        <div class="language-selection" id="languageSelection">
                            <div class="lang-add-btn" id="langAddBtn">
                                <span>+</span> Add Language
                            </div>
                        </div>
                        <div class="lang-dropdown" id="langDropdown"></div>
                        <div class="selected-languages" id="selectedLanguages"></div>
                    </div>

                    <div class="form-group">
                        <label>Bio</label>
                        <textarea id="bio" rows="3" placeholder="Tell us about your skills and experience..."></textarea>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">Create Account</button>
                </form>

                <div class="auth-footer">
                    Already have an account? <a href="/templates/worker-login.html">Login here</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const allLanguages = [
            { code: 'wo', name: 'Wolof' },
            { code: 'fr', name: 'French' },
            { code: 'en', name: 'English' },
            { code: 'pcm', name: 'Nigerian Pidgin' },
            { code: 'ha', name: 'Hausa' },
            { code: 'sw', name: 'Swahili' },
            { code: 'sh', name: 'Sheng' },
            { code: 'ak', name: 'Akan' },
            { code: 'am', name: 'Amharic' },
            { code: 'bm', name: 'Bambara' },
            { code: 'diou', name: 'Dioula' },
            { code: 'af', name: 'Afrikaans' },
            { code: 'zu', name: 'Zulu' },
            { code: 'yo', name: 'Yoruba' },
            { code: 'ig', name: 'Igbo' },
            { code: 'ff', name: 'Fula' },
            { code: 'rw', name: 'Kinyarwanda' },
            { code: 'lg', name: 'Luganda' },
            { code: 'sn', name: 'Shona' },
            { code: 'mg', name: 'Malagasy' }
        ];

        const countries = [
            { code: 'SN', name: 'Senegal' },
            { code: 'NG', name: 'Nigeria' },
            { code: 'KE', name: 'Kenya' },
            { code: 'GH', name: 'Ghana' },
            { code: 'CI', name: 'Ivory Coast' },
            { code: 'ML', name: 'Mali' },
            { code: 'CM', name: 'Cameroon' },
            { code: 'TZ', name: 'Tanzania' },
            { code: 'ET', name: 'Ethiopia' },
            { code: 'ZA', name: 'South Africa' }
        ];

        let selectedLangs = [];

        // Load countries
        const countrySelect = document.getElementById('country');
        countries.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.code;
            opt.textContent = c.name;
            countrySelect.appendChild(opt);
        });

        // Language dropdown
        const langDropdown = document.getElementById('langDropdown');
        const langAddBtn = document.getElementById('langAddBtn');
        const selectedLangsContainer = document.getElementById('selectedLanguages');

        function renderLangDropdown() {
            langDropdown.innerHTML = allLanguages
                .filter(l => !selectedLangs.includes(l.code))
                .map(l => `
                    <div class="lang-option" data-code="${l.code}">${l.name}</div>
                `).join('');

            langDropdown.querySelectorAll('.lang-option').forEach(opt => {
                opt.addEventListener('click', () => {
                    selectedLangs.push(opt.dataset.code);
                    renderSelectedLangs();
                    renderLangDropdown();
                    langDropdown.classList.remove('show');
                });
            });
        }

        function renderSelectedLangs() {
            selectedLangsContainer.innerHTML = selectedLangs
                .map(code => {
                    const lang = allLanguages.find(l => l.code === code);
                    return `
                        <div class="selected-lang">
                            ${lang.name}
                            <button type="button" onclick="removeLang('${code}')">&times;</button>
                        </div>
                    `;
                }).join('');
        }

        window.removeLang = function(code) {
            selectedLangs = selectedLangs.filter(l => l !== code);
            renderSelectedLangs();
            renderLangDropdown();
        };

        langAddBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            langDropdown.classList.toggle('show');
        });

        document.addEventListener('click', () => {
            langDropdown.classList.remove('show');
        });

        langDropdown.addEventListener('click', (e) => {
            e.stopPropagation();
        });

        renderLangDropdown();

        // Form submission
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const errorDiv = document.getElementById('error');
            const successDiv = document.getElementById('success');
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');

            const password = document.getElementById('password').value;
            const password2 = document.getElementById('password2').value;

            if (password !== password2) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.classList.add('show');
                return;
            }

            const data = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: password,
                password2: password2,
                phone: document.getElementById('phone').value,
                country: document.getElementById('country').value || null,
                languages: selectedLangs,
                bio: document.getElementById('bio').value
            };

            document.getElementById('submitBtn').disabled = true;

            try {
                const response = await fetch('/api/v1/workers/auth/register/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || JSON.stringify(result));
                }

                localStorage.setItem('workerToken', result.tokens.access);
                localStorage.setItem('workerData', JSON.stringify(result.worker));

                successDiv.textContent = 'Account created! Redirecting...';
                successDiv.classList.add('show');

                setTimeout(() => {
                    window.location.href = '/templates/worker-dashboard.html';
                }, 1500);

            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.add('show');
            } finally {
                document.getElementById('submitBtn').disabled = false;
            }
        });
    </script>
</body>
</html>
