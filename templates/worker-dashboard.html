<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Dashboard - Moussoum Defar</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="/templates/index.html" class="nav-back">← Back to Home</a>
            <button class="btn btn-outline" onclick="logout()">Logout</button>
        </div>

        <div class="header">
            <h1>Worker Dashboard</h1>
            <p>Welcome back, <span id="welcomeName">Worker</span></p>
        </div>

        <div id="loginPrompt" class="card" style="text-align: center; max-width: 500px; margin: 0 auto;">
            <h2>Please Login</h2>
            <p style="color: var(--text-secondary); margin-bottom: 24px;">You need to login to access your dashboard.</p>
            <a href="/templates/worker-login.html" class="btn">Login</a>
        </div>

        <div id="dashboard" style="display: none;">
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="level">1</div>
                    <div class="stat-label">Level</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="qualityScore">0</div>
                    <div class="stat-label">Quality Score</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalTasks">0</div>
                    <div class="stat-label">Total Tasks</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="balance">$0</div>
                    <div class="stat-label">Balance</div>
                </div>
            </div>

            <div class="card">
                <h2>My Profile</h2>
                <div class="profile-grid">
                    <div class="profile-item">
                        <label>Username</label>
                        <p id="username">-</p>
                    </div>
                    <div class="profile-item">
                        <label>Email</label>
                        <p id="email">-</p>
                    </div>
                    <div class="profile-item">
                        <label>Phone</label>
                        <p id="phone">-</p>
                    </div>
                    <div class="profile-item">
                        <label>Country</label>
                        <p id="country">-</p>
                    </div>
                    <div class="profile-item">
                        <label>Languages</label>
                        <p id="languages">-</p>
                    </div>
                    <div class="profile-item">
                        <label>Accuracy</label>
                        <p id="accuracy">0%</p>
                    </div>
                </div>
                <div style="margin-top: 20px;">
                    <label style="font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px;">Bio</label>
                    <p id="bio" style="margin-top: 8px; color: var(--text);">-</p>
                </div>
            </div>

            <div class="card">
                <h2>Available Data Collections</h2>
                <div id="collections">
                    <p style="color: var(--text-secondary);">Loading collections...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('workerToken');
        const workerData = JSON.parse(localStorage.getItem('workerData') || 'null');

        if (!token || !workerData) {
            document.getElementById('loginPrompt').style.display = 'block';
        } else {
            document.getElementById('dashboard').style.display = 'block';
            loadDashboard();
        }

        async function loadDashboard() {
            document.getElementById('welcomeName').textContent = workerData.user?.username || 'Worker';
            document.getElementById('username').textContent = workerData.user?.username || '-';
            document.getElementById('email').textContent = workerData.user?.email || '-';
            document.getElementById('phone').textContent = workerData.phone || '-';
            document.getElementById('country').textContent = workerData.country?.name || '-';
            document.getElementById('languages').textContent = workerData.languages?.map(l => l.name).join(', ') || '-';
            document.getElementById('bio').textContent = workerData.bio || '-';
            document.getElementById('level').textContent = workerData.level || 1;
            document.getElementById('qualityScore').textContent = (workerData.quality_score || 0).toFixed(1);
            document.getElementById('totalTasks').textContent = workerData.total_tasks || 0;
            document.getElementById('balance').textContent = '$' + (workerData.balance || 0);
            document.getElementById('accuracy').textContent = (workerData.accuracy || 0).toFixed(1) + '%';

            try {
                const response = await fetch('/api/v1/workers/data-collections/', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    displayCollections(data.results || []);
                }
            } catch (error) {
                console.error('Error loading collections:', error);
            }
        }

        function displayCollections(collections) {
            const container = document.getElementById('collections');
            
            if (collections.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary);">No active collections available at the moment.</p>';
                return;
            }

            container.innerHTML = collections.map(c => `
                <div class="collection-item">
                    <h3>${c.title}</h3>
                    <p>${c.description}</p>
                    <div class="collection-meta">
                        <span>📁 ${c.data_type}</span>
                        <span>🌍 ${c.language?.name || 'N/A'}</span>
                        <span>📍 ${c.country?.name || 'N/A'}</span>
                        <span>💰 $${c.price_per_item}/item</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${c.progress_percentage || 0}%"></div>
                    </div>
                    <p style="font-size: 12px; color: var(--text-secondary); margin-top: 8px;">
                        ${c.current_count || 0} / ${c.target_count || 0} items (${(c.progress_percentage || 0).toFixed(1)}%)
                    </p>
                </div>
            `).join('');
        }

        function logout() {
            localStorage.removeItem('workerToken');
            localStorage.removeItem('workerData');
            window.location.href = '/templates/worker-login.html';
        }
    </script>
</body>
</html>
